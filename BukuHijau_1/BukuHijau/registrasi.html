<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi - BukuHijau</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cc_login.css">
</head>
<body>
    <div class="page">

        <!-- KIRI: branding -->
        <section class="brand">
            <img src="buku_hijau_logo-removebg-preview.png" alt="Logo BukuHijau" class="logo">
            <p class="tagline">Baca &bull; Belajar &bull; Berkembang</p>
            <p class="desc">Sistem Informasi Perpustakaan<br>Mudah, cepat, dan ramah lingkungan.</p>
            <img src="pngtree-green-book-png-image_3423675-removebg-preview.png" alt="Ilustrasi tumpukan buku" class="gambar">
        </section>

        <!-- KANAN: form registrasi -->
        <main class="card">
            <form id="form" novalidate>
                <h1>Registrasi ke BukuHijau</h1>
                <p class="sub">Isi pendaftaran di bawah ini agar bisa mengakses layanan kami</p>

                <div class="field">
                    <label for="nama">Nama lengkap</label>
                    <div class="input-wrap">
                        <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" autocomplete="name" required>
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
                    </div>
                    <p class="error" id="err-nama"></p>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <div class="input-wrap">
                        <input type="email" id="email" name="email" placeholder="Masukkan email" autocomplete="email" required>
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
                    </div>
                    <p class="error" id="err-email"></p>
                </div>

                <div class="field">
                    <label for="password">Kata sandi</label>
                    <div class="input-wrap">
                        <input type="password" id="password" name="password" placeholder="Masukkan kata sandi" autocomplete="new-password" required minlength="8">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </div>
                    <p class="error" id="err-password"></p>
                </div>

                <div class="field">
                    <label for="konfirmasi">Ulangi kata sandi</label>
                    <div class="input-wrap">
                        <input type="password" id="konfirmasi" name="konfirmasi" placeholder="Ulangi kata sandi" autocomplete="new-password" required minlength="8">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </div>
                    <p class="error" id="err-konfirmasi"></p>
                </div>

                <button type="submit" class="button"><a href="index.html">Daftar sekarang</a></button>
                <div class="success" id="success" role="status">Pendaftaran berhasil. Silakan cek email Anda.</div>

                <p class="login">Sudah punya akun? <a href="login1.html">Masuk</a></p>
            </form>
        </main>
    </div>
    <script src="script2.js"></script>
</bodykan besok besok libur
</html>
