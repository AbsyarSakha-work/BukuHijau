<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - BukuHijau</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cc_login.css">
</head>
<body>
    <div class="page">

        <!-- KIRI: branding -->
        <section class="brand">
            <img src="buku_hijau_logo-removebg-preview.png" alt="Logo BukuHijau" class="logo">
            <p class="tagline">Baca &bull; Belajar &bull; Berkembang</p>
            <p class="desc">Sistem Informasi Perpustakaan<br>Mudah, cepat, dan ramah lingkungan.</p>
            <img src="pngtree-green-book-png-image_3423675-removebg-preview.png" alt="Ilustrasi tumpukan buku" class="gambar">
        </section>

        <!-- KANAN: form login -->
        <main class="card">
            <form id="form" novalidate>
                <h1>Masuk ke BukuHijau</h1>
                <p class="sub">Silakan masuk ke akun Anda untuk melanjutkan</p>

                <div class="field">
                    <label for="username">Username</label>
                    <div class="input-wrap">
                        <input type="text" id="username" name="username" placeholder="Masukkan username" autocomplete="username" required>
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
                    </div>
                    <p class="error" id="err-username"></p>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <input type="password" id="password" name="password" placeholder="Masukkan password" autocomplete="current-password" required minlength="8">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </div>
                    <p class="error" id="err-password"></p>
                </div>

                <button type="submit" class="button"><a href="index.html">Masuk</a></button>

                <p class="login">Belum punya akun? <a href="registrasi.html">Daftar sekarang</a></p>
            </form>
        </main>

    </div>
    <script src="script3.js"></script>
</body>
</html>
